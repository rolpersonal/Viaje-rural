name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o "viaje-rural (1).zip" -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Grant permissions to gradlew
        run: |
          find . -name "gradlew" -exec chmod +x {} \;

      - name: Build with Gradle
        run: |
          GRADLEW=$(find . -name "gradlew" | head -n 1)
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: viaje-rural-apk
          path: "**/*.apk"
