name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o "viaje-rural (1).zip" -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          TARGET_DIR=$(find . -type d -name "android-native" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "ERROR: No se encontró la carpeta android-native"
            exit 1
          fi
          echo "Entrando a la carpeta: $TARGET_DIR"
          cd "$TARGET_DIR"
          chmod +x gradlew || true
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle wrapper
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: viaje-rural-apk
          path: "**/*.apk"
