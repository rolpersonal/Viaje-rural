name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o "viaje-rural (1).zip" -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle (Direct)
        run: |
          # Buscar si existe el gradlew. Si no, usar gradle directamente.
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -f "$GRADLEW_PATH" ]; then
            echo "Usando gradlew encontrado en: $GRADLEW_PATH"
            DIR=$(dirname "$GRADLEW_PATH")
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "No se encontró gradlew. Compilando con gradle del sistema..."
            # Buscar la carpeta que contiene el build.gradle raíz
            BUILD_DIR=$(find . -name "build.gradle" -o -name "build.gradle.kts" | grep -v "/app/" | head -n 1 | xargs dirname)
            echo "Carpeta del proyecto: $BUILD_DIR"
            cd "$BUILD_DIR"
            gradle wrapper
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: viaje-rural-apk
          path: "**/*.apk"
